name: Test iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ios/**
    branches:
      - main
      - develop

jobs:
  test_ios:
    name: test ios
    runs-on: macos-15

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # Mintのインストール
    - name: Install Mint
      run: brew install mint

    # Mintのキャッシュの取得
    - name: Cache Mint packages
      uses: actions/cache@v4
      with:
        path: ios/.mint
        key: ${{ runner.os }}-mint-${{ hashFiles('ios/Mintfile') }}
        restore-keys: |
          ${{ runner.os }}-mint-

    # Mintで管理しているライブラリのインストール
    - name: Install Mint packages
      working-directory: ios
      run: mint bootstrap

    # SwiftLintによるチェック
    - name: SwiftLint
      working-directory: ios
      run: mint run swiftlint swiftlint --strict

    # xcodegen でプロジェクトを生成
    - name: Generate Xcode project
      working-directory: ios
      run: mint run xcodegen xcodegen generate

    # SwiftPM のキャッシュ
    - name: Cache SwiftPM packages
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    # ユニットテスト
    - name: Unit Test
      working-directory: ios
      run: |
        set -o pipefail
        xcodebuild test \
          -project Reaction.xcodeproj \
          -scheme Development \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions
