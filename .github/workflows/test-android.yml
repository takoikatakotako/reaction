name: Test Android

on:
  workflow_dispatch:
  # main への push でも実行して Gradle のキャッシュを main に作る
  # （PR の run は main のキャッシュを参照できるため）
  push:
    branches:
      - main
    paths:
      - android/**
      - scripts/firebase-config.sh
      - .github/workflows/test-android.yml
  pull_request:
    paths:
      - android/**
      - scripts/firebase-config.sh
      - .github/workflows/test-android.yml
    branches:
      - main
      - develop

env:
  AWS_ROLE_ARN: arn:aws:iam::392961483375:role/reaction-github-action-role
  AWS_PRODUCTION_ROLE_ARN: arn:aws:iam::852798039462:role/reaction-ci-role

jobs:
  test_android:
    name: test android
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # google-services.json は SSM がマスターでリポジトリに置いていないため、
    # ビルド前に取得する（google-services プラグインが無いと失敗する）
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        role-session-name: github-action-role-${{ github.run_id }}
        aws-region: ap-northeast-1

    # ~/.aws/config のプロファイル（credential_source = Environment）は
    # 使えない。AWS CLI は環境変数の認証情報をプロファイルより優先するため、
    # AWS_PROFILE を指定しても management のままになる。ロールを繋ぐ。
    - name: assume production role
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_PRODUCTION_ROLE_ARN }}
        role-session-name: reaction-ci-role-${{ github.run_id }}
        role-chaining: true
        aws-region: ap-northeast-1

    - name: Fetch google-services.json
      run: ./scripts/firebase-config.sh pull android

    # JDK のセットアップ（AGP 9 は JDK 17 以上が必須）
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    # Android SDK のセットアップ（ライセンス同意を含む）
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    # Gradle のセットアップとキャッシュ
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # Lint
    - name: Lint
      working-directory: android
      run: ./gradlew lintDebug

    # ユニットテスト
    - name: Unit Test
      working-directory: android
      run: ./gradlew testDebugUnitTest

    # デバッグビルド
    - name: Build
      working-directory: android
      run: ./gradlew assembleDebug

    # 失敗時に調査できるようレポートを残す
    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-reports
        path: |
          android/app/build/reports/
        retention-days: 7
