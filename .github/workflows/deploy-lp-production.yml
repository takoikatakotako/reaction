name: Deploy LP Production

on:
  workflow_dispatch:
  # main に入った変更をそのまま反映する。静的ファイルだけでビルドが無く、
  # 戻すのも再デプロイで済むため自動にしている。
  push:
    branches:
      - main
    paths:
      - lp/**
      - .github/workflows/deploy-lp-production.yml

env:
  AWS_ROLE_ARN: arn:aws:iam::392961483375:role/reaction-github-action-role
  BUCKET: reaction-production-lp
  DISTRIBUTION_ID: ${{ vars.LP_PRODUCTION_DISTRIBUTION_ID }}

concurrency:
  group: deploy-lp-production
  cancel-in-progress: false

jobs:
  deploy_lp_production:
    name: deploy lp production
    runs-on: ubuntu-latest
    # 配信基盤ができるまでは何もしない。この変数は apply 後に登録するため、
    # 初回マージ時点では未設定で、その状態で走ると失敗するだけになる。
    if: vars.LP_PRODUCTION_DISTRIBUTION_ID != ''
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        role-session-name: github-action-role-${{ github.run_id }}
        aws-region: ap-northeast-1

    - name: configure aws profiles
      run: |
        mkdir -p ~/.aws
        cp .github/workflows/aws_config/config ~/.aws/config

    # プロファイルは AWS_PROFILE ではなく --profile で渡す。AWS CLI は
    # 環境変数の認証情報をプロファイルより優先するため、AWS_PROFILE だと
    # OIDC で得た management のロールのまま呼んでしまい 403 になる。
    # コマンドラインオプションは環境変数より優先される。
    #
    # 先に前提を確かめる。--delete はバケットの中身を消すので、
    # 配信先が揃っていない状態で走らせない。
    - name: Preflight
      run: |
        if ! err="$(aws s3api head-bucket --bucket "$BUCKET" \
              --profile reaction-production 2>&1 >/dev/null)"; then
          echo "::error::バケット $BUCKET を参照できません: ${err}"
          exit 1
        fi
        # 権限不足と未存在を区別できるよう、CLI のエラーをそのまま出す。
        if ! err="$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" \
              --profile reaction-production 2>&1 >/dev/null)"; then
          echo "::error::CloudFront $DISTRIBUTION_ID を参照できません: ${err}"
          exit 1
        fi

    # --delete で S3 側の余分なファイルを消す。lp/ がそのまま配信内容になる。
    - name: Sync to S3
      run: aws s3 sync lp/ "s3://${BUCKET}/" --delete --profile reaction-production

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          --paths '/*' \
          --profile reaction-production
