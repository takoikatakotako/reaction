name: Test Scripts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - ios/Makefile
      - .github/workflows/test-scripts.yml
  pull_request:
    paths:
      - scripts/**
      - ios/Makefile
      - .github/workflows/test-scripts.yml
    branches:
      - main
      - develop

jobs:
  test_scripts:
    name: test scripts
    runs-on: ubuntu-latest

    steps:
    # 配信番号はコミット数から採番するので、全履歴が要る
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Shell syntax check
      run: |
        for f in scripts/*.sh; do
          bash -n "$f" || exit 1
        done

    # 変数の直後に全角文字があると bash が変数名の一部として読む。
    # 実際に RETRY のバリデーションがこれで動いていなかった。
    - name: Check variable expansion before multibyte characters
      run: |
        python3 - <<'PY'
        import re, glob, sys
        pat = re.compile(r'\$[a-zA-Z_][a-zA-Z0-9_]*')
        bad = []
        for f in glob.glob('scripts/*.sh'):
            for i, line in enumerate(open(f), 1):
                for m in pat.finditer(line):
                    nxt = line[m.end():m.end()+1]
                    if nxt and ord(nxt) > 127:
                        bad.append(f"{f}:{i}: {m.group()} の直後に {nxt!r}。${{...}} で囲むこと")
        print("\n".join(bad) if bad else "問題なし")
        sys.exit(1 if bad else 0)
        PY

    - name: Version numbering
      run: ./scripts/test-version-numbering.sh
