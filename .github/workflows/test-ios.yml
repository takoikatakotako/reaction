name: Test iOS

on:
  workflow_dispatch:
  # main への push でも実行して Mint / SwiftPM のキャッシュを main に作る
  # （PR の run は main のキャッシュを参照できるため、新しい PR が毎回コールドスタートになるのを防ぐ）
  push:
    branches:
      - main
    paths:
      - ios/**
      - .github/workflows/test-ios.yml
  pull_request:
    paths:
      - ios/**
      - .github/workflows/test-ios.yml
    branches:
      - main
      - develop

env:
  # mint のインストール先をリポジトリ配下にして actions/cache の対象にする
  MINT_PATH: ${{ github.workspace }}/ios/.mint
  MINT_LINK_PATH: ${{ github.workspace }}/ios/.mint/bin

jobs:
  test_ios:
    name: test ios
    # LicenseList 2.5.0 / Kingfisher 8.13.0 が Swift tools 6.2 を要求するため
    # Xcode 26 を含むランナーを使う（macos-15 は Swift 6.1 で解決に失敗する）
    runs-on: macos-26

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # 使用している Xcode / Swift を記録しておく（依存の要求バージョンとの突き合わせ用）
    - name: Show Xcode version
      run: |
        xcodebuild -version
        swift --version

    # Mintのインストール
    - name: Install Mint
      run: brew install mint

    # Mintのキャッシュの取得（保存はジョブ失敗時も行うため restore / save を分ける）
    - name: Restore Mint packages
      id: mint-cache
      uses: actions/cache/restore@v4
      with:
        path: ios/.mint
        key: ${{ runner.os }}-mint-${{ hashFiles('ios/Mintfile') }}

    # Mintで管理しているライブラリのインストール
    - name: Install Mint packages
      working-directory: ios
      run: mint bootstrap

    - name: Save Mint packages
      if: always() && steps.mint-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ios/.mint
        key: ${{ steps.mint-cache.outputs.cache-primary-key }}

    # SwiftLintによるチェック
    - name: SwiftLint
      working-directory: ios
      run: mint run swiftlint swiftlint --strict

    # xcodegen でプロジェクトを生成
    - name: Generate Xcode project
      working-directory: ios
      run: make generate

    # SwiftPM のキャッシュ（DerivedData を固定パスにしてその中の SourcePackages を保存する）
    - name: Restore SwiftPM packages
      id: spm-cache
      uses: actions/cache/restore@v4
      with:
        path: ios/DerivedData/SourcePackages
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/Package.resolved') }}

    # 利用可能な iPhone シミュレータを動的に選ぶ
    # （ランナーイメージの更新で特定の機種名が消えることがあるため）
    - name: Select simulator
      id: simulator
      run: |
        set -o pipefail
        udid=$(xcrun simctl list devices available --json \
          | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
        name=$(xcrun simctl list devices available --json \
          | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .name')
        if [ -z "$udid" ] || [ "$udid" = "null" ]; then
          echo "利用可能な iPhone シミュレータが見つかりません" >&2
          xcrun simctl list devices available
          exit 1
        fi
        echo "使用するシミュレータ: $name ($udid)"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    # ユニットテスト
    - name: Unit Test
      working-directory: ios
      run: |
        set -o pipefail
        xcodebuild test \
          -project Reaction.xcodeproj \
          -scheme Development \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -derivedDataPath DerivedData \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions

    - name: Save SwiftPM packages
      if: always() && steps.spm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ios/DerivedData/SourcePackages
        key: ${{ steps.spm-cache.outputs.cache-primary-key }}
