name: Reaction

options:
  deploymentTarget:
    iOS: 17.0
schemes:
  Development:
    build:
      targets:
        ReactionDevelopment: all
        ReactionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReactionTests
  Production:
    build:
      targets:
        ReactionProduction: all
    run:
      config: Release
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5RH346BQ66
    MARKETING_VERSION: 6.2.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  Rswift:
    url: https://github.com/mac-cain13/R.swift
    from: 7.8.0
  LicenseList:
    url: https://github.com/cybozu/LicenseList
    from: 2.5.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.13.0

targetTemplates:
  ReactionApp:
    type: application
    platform: iOS
    dependencies:
      - package: Rswift
        product: RswiftLibrary
      - package: LicenseList
        product: LicenseList
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Kingfisher
    buildToolPlugins:
      - plugin: RswiftGenerateInternalResources
        package: Rswift
      - plugin: PrepareLicenseList
        package: LicenseList
    postBuildScripts:
      # Crashlytics に dSYM をアップロードする。
      # これが無いとクラッシュは記録されてもスタックトレースが記号化されない。
      # SwiftPM 構成なので run スクリプトは SourcePackages/checkouts 配下にある。
      - name: Upload dSYM to Crashlytics
        script: |
          # ローカルではシミュレータのテストクラッシュも Crashlytics に送れるため、
          # 記号化できるよう dSYM をアップロードする。
          # CI はクラッシュを送らないので通信だけ無駄になる。ここだけスキップする。
          if [ "${CI}" = "true" ]; then
            echo "note: CI 実行のため dSYM のアップロードをスキップします"
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
        basedOnDependencyAnalysis: false

targets:
  ReactionDevelopment:
    templates:
      - ReactionApp
    sources:
      - path: Reaction
      - path: Config/Development
    settings:
      base:
        MARKETING_VERSION: 6.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Development
        CODE_SIGN_ENTITLEMENTS: Config/Development/ReactionDevelopment.entitlements
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        PRODUCT_BUNDLE_IDENTIFIER: com.swiswiswift.reaction.development
        REACTIONS_ENDPOINT: https://reaction-development.swiswiswift.com/resource/reaction/list.json
        QUESTIONS_ENDPOINT: https://reaction-development.swiswiswift.com/resource/question/list.json
        NOTICES_ENDPOINT: https://reaction-development.swiswiswift.com/resource/notice/list.json
    info:
      path: Reaction/Info/Info.plist
      properties:
        Appearance: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Reaction
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: app-background-color
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: YES
        UIAppFonts:
          - MPLUS2-VariableFont.ttf
        MinimumOSVersion: "17.0"
        REACTIONS_ENDPOINT: $(REACTIONS_ENDPOINT)
        QUESTIONS_ENDPOINT: $(QUESTIONS_ENDPOINT)
        NOTICES_ENDPOINT: $(NOTICES_ENDPOINT)
  ReactionProduction:
    templates:
      - ReactionApp
    sources:
      - path: Reaction
      - path: Config/Production
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Production
        CODE_SIGN_ENTITLEMENTS: Config/Production/ReactionProduction.entitlements
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        PRODUCT_BUNDLE_IDENTIFIER: com.example.junpei.chemi
        REACTIONS_ENDPOINT: https://reaction-production.swiswiswift.com/resource/reaction/list.json
        QUESTIONS_ENDPOINT: https://reaction-production.swiswiswift.com/resource/question/list.json
        NOTICES_ENDPOINT: https://reaction-production.swiswiswift.com/resource/notice/list.json
    info:
      path: Reaction/Info/Info.plist
      properties:
        Appearance: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Reaction
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: app-background-color
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: YES
        UIAppFonts:
          - MPLUS2-VariableFont.ttf
        MinimumOSVersion: "17.0"
        REACTIONS_ENDPOINT: $(REACTIONS_ENDPOINT)
        QUESTIONS_ENDPOINT: $(QUESTIONS_ENDPOINT)
        NOTICES_ENDPOINT: $(NOTICES_ENDPOINT)
  ReactionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReactionTests
    dependencies:
      - target: ReactionDevelopment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiswiswift.reaction.development.tests
        GENERATE_INFOPLIST_FILE: YES
